---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shippingservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shippingservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shippingservice
    spec:
      containers:
      - name: shippingservice-container
        image: shippingservice:v1
        ports:
        - containerPort: 50051
        env:
        - name: PORT
          value: "50051"
        - name: DISABLE_PROFILER
          value: "1" 
        resources:
          requests:
            cpu: 200m
            memory: 64mi
          limits:
            cpu: 300m
            memory: 150Mi
        readinessProbe:
          grpc:
            port: 50051
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          grpc:
            port: 50051
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: shippingservice
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shippingservice
  ports:
  - port: 50051
    targetPort: 50051
    name: grpc
